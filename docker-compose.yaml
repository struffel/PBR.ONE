version: '3'
services:
  # Bundles ./src, rebuilds on changes and serves.
  PBR.ONE-Dev-Main:
    image: oven/bun:1
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun scripts/dev.js 8080"
    ports:
      - "8080:8080"
    environment:
      # Optional: rebuild every N seconds instead of relying on file events (e.g. Docker Desktop with WSL),
      # for example `REBUILD_INTERVAL=2 docker compose up`
      - REBUILD_INTERVAL
    volumes:
      - .:/app
      # Keep the container's Linux node_modules and the build output off the host bind mount
      - /app/node_modules
      - /app/dist

    # Serves the stress-test files with Nginx
  PBR.ONE-Dev-Test:
    image: nginx
    ports:
      - "8081:80"
    volumes:
      - ./test:/etc/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf

  # Serves the files for the pbr.one website
  PBR.ONE-Dev-Web:
    image: nginx
    ports:
      - "8082:80"
    volumes:
      - ./web:/etc/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
  
  # Serves the documentation site with MkDocs
  PBR.ONE-Dev-Docs:
    image: squidfunk/mkdocs-material:9.1.21
    ports:
      - "8083:8000"
    volumes:
      - "./docs:/docs"
