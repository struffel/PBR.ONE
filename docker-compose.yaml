version: '3'
services:
  PBR.ONE-Dev-Main:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./src:/app
    ports:
      - "8080:8080"
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 8080"

  PBR.ONE-Dev-Test:
    image: nginx
    ports:
      - "8081:80"
    volumes:
      - ./test:/etc/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf

  PBR.ONE-Dev-Web:
    image: nginx
    ports:
      - "8082:80"
    volumes:
      - ./web:/etc/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf
  
  PBR.ONE-Dev-Docs:
    image: squidfunk/mkdocs-material:9.1.21
    ports:
      - "8083:8000"
    volumes:
      - "./docs:/docs"
    
